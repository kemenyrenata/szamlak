<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Radar — Utilities Invoice Tracker</title>
<style>
  :root {
    --primary: #6d4aff;
    --primary-dark: #5938d6;
    --bg: #f4f4f8;
    --surface: #ffffff;
    --border: #e3e3ec;
    --text: #1f2033;
    --text-muted: #6b6c80;
    --green: #1e9e5a;
    --green-bg: #e6f7ee;
    --amber: #b26a00;
    --amber-bg: #fff3dd;
    --red: #c22b3d;
    --red-bg: #fce8ea;
    --blue: #1a66d6;
    --blue-bg: #e8f0fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--primary); color: #fff; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 34px; height: 34px; }
  .brand h1 { font-size: 19px; font-weight: 700; }
  .brand small { display: block; font-size: 11px; opacity: .85; font-weight: 400; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .month-nav { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.15); border-radius: 10px; padding: 4px; }
  .month-nav button { background: transparent; border: none; color: #fff; font-size: 17px; padding: 6px 12px; cursor: pointer; border-radius: 8px; }
  .month-nav button:hover { background: rgba(255,255,255,.2); }
  .month-label { color: #fff; font-weight: 600; min-width: 130px; text-align: center; font-size: 15px; }
  #todayBtn { font-size: 12px !important; font-weight: 600; }

  .btn { border: none; border-radius: 9px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(.93); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-light { background: rgba(255,255,255,.92); color: var(--primary); }
  .btn-outline { background: transparent; color: inherit; border: 1.5px solid currentColor; opacity: .85; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { color: var(--text); }

  main { max-width: 880px; margin: 0 auto; padding: 22px 18px 60px; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .sum-card .num { font-size: 24px; font-weight: 700; }
  .sum-card .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .sum-card.overdue .num { color: var(--red); }

  .section { margin-bottom: 26px; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .section-head h2 { font-size: 15px; font-weight: 700; }
  .section-head .count { font-size: 12px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); padding: 2px 10px; border-radius: 20px; }

  .inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .inv-card:hover { box-shadow: 0 4px 14px rgba(31,32,51,.09); transform: translateY(-1px); }
  .inv-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .inv-main { flex: 1; min-width: 180px; }
  .inv-name { font-weight: 600; font-size: 15px; }
  .inv-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .inv-right { text-align: right; }
  .inv-amount { font-weight: 700; font-size: 16px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: .3px; }
  .b-paid { background: var(--green-bg); color: var(--green); }
  .b-received { background: var(--blue-bg); color: var(--blue); }
  .b-expected { background: #eeeef4; color: var(--text-muted); }
  .b-late { background: var(--amber-bg); color: var(--amber); }
  .b-overdue { background: var(--red-bg); color: var(--red); }
  .diff { font-size: 12px; font-weight: 600; }
  .diff.up { color: var(--amber); }
  .diff.down { color: var(--green); }

  .empty { text-align: center; padding: 46px 20px; color: var(--text-muted); }
  .empty .big { font-size: 40px; margin-bottom: 8px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,20,35,.45); display: none; align-items: flex-start; justify-content: center; padding: 40px 14px; z-index: 100; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 18px 60px rgba(0,0,0,.25); }
  .modal h3 { font-size: 18px; margin-bottom: 16px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 13px; }
  .checkline input { width: 17px; height: 17px; accent-color: var(--primary); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: #fff; padding: 12px 22px; border-radius: 12px; font-size: 14px; opacity: 0; transition: all .3s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .banner { background: var(--amber-bg); border: 1px solid #f0d9ad; color: var(--amber); border-radius: 12px; padding: 11px 16px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .banner button { font-size: 12px; }

  .storage-note { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 26px; }

  .prov-list-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .prov-list-item .p-main { flex: 1; min-width: 160px; }
  .prov-list-item .p-name { font-weight: 600; font-size: 14px; }
  .prov-list-item .p-sub { font-size: 12px; color: var(--text-muted); }
  .inactive { opacity: .55; }
  .cat-chip { font-size: 10.5px; padding: 2px 8px; border-radius: 12px; background: #eeeef4; color: var(--text-muted); font-weight: 700; }

  .modal.wide { max-width: 560px; }
  textarea.code { font-family: ui-monospace, monospace; font-size: 11.5px !important; }
  .danger-zone { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 16px; }
  @media (max-width: 520px) {
    .inv-right { text-align: left; }
    .row3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="rgba(255,255,255,.18)"/><path d="M27 12 L18 21 L14 17 L10 21 L18 29 L31 16 Z" fill="#fff"/></svg>
    <div>
      <h1>Bill Radar</h1>
      <small>utilities invoice tracker</small>
    </div>
  </div>
  <div class="month-nav">
    <button id="prevMonth" title="Previous month">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button id="nextMonth" title="Next month">›</button>
    <button id="todayBtn" title="Jump to current month">Today</button>
  </div>
  <div class="header-actions">
    <button class="btn btn-light" onclick="openProviderModal()">＋ Provider</button>
    <button class="btn btn-outline" onclick="openProvidersModal()" style="color:#fff">⚙︎</button>
  </div>
</header>

<main>
  <div id="sampleBanner" class="banner" style="display:none">
    <span>👋 This is <b>sample data</b> — three example providers so you can try everything out.</span>
    <button class="btn btn-outline" onclick="clearSampleData()" style="padding:5px 12px">Remove sample data</button>
  </div>

  <div class="summary" id="summaryRow"></div>

  <div id="listArea"></div>

  <p class="storage-note" id="storageNote"></p>
</main>

<!-- Provider add/edit modal -->
<div class="modal-overlay" id="providerModalOverlay">
  <div class="modal">
    <h3 id="providerModalTitle">Add provider</h3>
    <div class="field">
      <label>Name *</label>
      <input id="pName" placeholder="e.g. City Power Inc.">
    </div>
    <div class="row2">
      <div class="field">
        <label>Category</label>
        <select id="pCategory">
          <option>Electricity</option><option>Gas</option><option>Water</option>
          <option>Internet</option><option>TV / Streaming</option><option>Phone</option>
          <option>Insurance</option><option>Rent</option><option>Waste</option><option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Expected amount</label>
        <input id="pAmount" type="number" step="0.01" min="0" placeholder="leave blank if variable">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Invoice usually arrives on day of month</label>
        <input id="pBillingDay" type="number" min="1" max="31" value="5">
      </div>
      <div class="field">
        <label>Payment window (days)</label>
        <input id="pDueDays" type="number" min="0" max="120" value="14">
        <div class="hint">due date = arrival + these days</div>
      </div>
    </div>
    <div class="field">
      <label>Account / customer number</label>
      <input id="pAccount" placeholder="optional">
    </div>
    <div class="field">
      <label>Notes</label>
      <input id="pNotes" placeholder="optional">
    </div>
    <div class="checkline">
      <input type="checkbox" id="pActive" checked>
      <label for="pActive" style="margin:0;font-weight:400;color:var(--text)">Active — show in monthly checklist</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('providerModalOverlay')">Cancel</button>
      <button class="btn btn-primary" onclick="saveProvider()">Save provider</button>
    </div>
  </div>
</div>

<!-- Invoice detail modal -->
<div class="modal-overlay" id="invoiceModalOverlay">
  <div class="modal" id="invoiceModalBody"></div>
</div>

<!-- Providers overview / settings modal -->
<div class="modal-overlay" id="settingsModalOverlay">
  <div class="modal wide">
    <h3>⚙︎ Providers &amp; Data</h3>
    <div id="provList"></div>
    <div style="margin-top:10px">
      <button class="btn btn-primary" onclick="closeModal('settingsModalOverlay'); openProviderModal()">＋ Add provider</button>
    </div>
    <div class="danger-zone">
      <div style="font-size:13px;margin-bottom:10px">
        <b>Backup:</b> copy the JSON below to save your data, or paste previously saved JSON to restore.
      </div>
      <div class="field">
        <textarea class="code" id="backupArea" rows="4"></textarea>
      </div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button class="btn btn-primary" onclick="loadBackup()">Import / Restore</button>
        <button class="btn btn-danger" onclick="resetAll()">Delete all data</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('settingsModalOverlay')">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- Storage (localStorage with in-memory fallback) ---------- */
const STORAGE_KEY = "billRadar.v1";
let persistent = true;
try { localStorage.setItem("__br_test","1"); localStorage.removeItem("__br_test"); }
catch(e) { persistent = false; }

const CURRENT_YEAR = new Date().getFullYear();
const CURRENT_MONTH = new Date().getMonth(); // 0-11

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultState() {
  const y = CURRENT_YEAR, m = CURRENT_MONTH;
  const key = monthKey(y, m);
  return {
    sample: true,
    providers: [
      { id:"smp1", name:"PowerGrid Energy", category:"Electricity", amount:"", billingDay:5, dueDays:14, account:"C-4471-882", notes:"Variable — usage-based", active:true, created:key },
      { id:"smp2", name:"AquaCity Utilities", category:"Water", amount:"", billingDay:12, dueDays:20, account:"", notes:"Quarterly reading, monthly estimate", active:true, created:key },
      { id:"smp3", name:"SwiftNet Internet", category:"Internet", amount:"49.90", billingDay:1, dueDays:10, account:"SN-102384", notes:"Fixed monthly rate", active:true, created:key }
    ],
    invoices: {}
  };
}

let state;
function loadState() {
  if (persistent) {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { try { state = JSON.parse(raw); return; } catch(e){} }
  }
  state = defaultState();
  saveState();
}
function saveState() {
  if (persistent) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
}

/* ---------- Helpers ---------- */
function monthKey(y, m) { return y + "-" + String(m+1).padStart(2,"0"); }
function keyParts(key) { const p = key.split("-"); return { y: +p[0], m: +p[1]-1 }; }
function fmtMonth(key) {
  const {y,m} = keyParts(key);
  return new Date(y, m, 1).toLocaleDateString(undefined, { month:"long", year:"numeric" });
}
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s) { const p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtDate(iso) { if(!iso) return "—"; return parseISO(iso).toLocaleDateString(undefined,{day:"numeric", month:"short", year:"numeric"}); }
function fmtMoney(v) {
  if (v === "" || v == null || isNaN(+v)) return "";
  return (+v).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
}
function esc(s) { const d = document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }

let viewKey = monthKey(CURRENT_YEAR, CURRENT_MONTH);

/* ---------- Computing monthly checklist ---------- */
function invKey(monthKey_, providerId) { return monthKey_ + "|" + providerId; }

function getEntry(pKey, p) {
  return state.invoices[invKey(pKey, p.id)] || null;
}

// Effective billing day clamped to the month's length
function effBillingDay(p, y, m) { return Math.min(p.billingDay, daysInMonth(y, m)); }

function computeRow(pKey, p) {
  const {y, m} = keyParts(pKey);
  const entry = getEntry(pKey, p);
  const bDay = effBillingDay(p, y, m);
  const arrival = new Date(y, m, bDay);
  const expectedDue = new Date(arrival.getTime() + p.dueDays * 86400000);
  const now = new Date(); now.setHours(0,0,0,0);

  const row = {
    provider: p, month: pKey,
    status: "expected", amount: "", dueDate: null,
    receivedDate: null, paidDate: null, note: "",
    arrivalDate: arrival, expectedDueDate: expectedDue,
    amountDiff: 0
  };

  if (entry) {
    row.status = entry.status || "expected";
    row.amount = entry.amount != null ? entry.amount : "";
    row.dueDate = entry.dueDate || null;
    row.receivedDate = entry.receivedDate || null;
    row.paidDate = entry.paidDate || null;
    row.note = entry.note || "";
  }

  // Derived alerts
  const GRACE_DAYS = 7;
  const isCurrentOrPast = new Date(y, m+1, 0) <= new Date(now.getFullYear(), now.getMonth()+1, 0);
  if (row.status === "expected" && isCurrentOrPast && (now - arrival) / 86400000 > GRACE_DAYS) {
    row.alert = "late";   // expected but never showed up
  }
  if (row.status === "received" && row.dueDate && parseISO(row.dueDate) < now) {
    row.alert = "overdue"; // received, due date passed, not paid
  }

  if (p.amount !== "" && p.amount != null && row.amount !== "" && row.amount != null) {
    row.amountDiff = (+row.amount) - (+p.amount);
  }
  return row;
}

function activeProvidersFor(pKey) {
  const cmp = pKey.localeCompare;
  return state.providers
    .filter(p => p.active && p.created.localeCompare(pKey) <= 0)
    .sort((a,b) => a.billingDay - b.billingDay);
}

/* ---------- Rendering ---------- */
const CAT_ICONS = { Electricity:"⚡", Gas:"🔥", Water:"💧", Internet:"🌐", "TV / Streaming":"📺", Phone:"📱", Insurance:"🛡️", Rent:"🏠", Waste:"🗑️", Other:"📄" };

function render() {
  document.getElementById("monthLabel").textContent = fmtMonth(viewKey);
  document.getElementById("sampleBanner").style.display = state.sample ? "flex" : "none";
  document.getElementById("storageNote").textContent = persistent
    ? "Data is stored locally in this browser."
    : "⚠ Storage is unavailable in this preview — use ⚙︎ → Backup to save your data as text.";

  const provs = activeProvidersFor(viewKey);
  const rows = provs.map(p => computeRow(viewKey, p));

  const paid = rows.filter(r => r.status === "paid");
  const received = rows.filter(r => r.status === "received");
  const expected = rows.filter(r => r.status === "expected");
  const overdueCount = rows.filter(r => r.alert === "overdue" || r.alert === "late").length;

  const sumPaid = paid.reduce((s,r) => s + (+r.amount || 0), 0);
  const sumOpen = received.reduce((s,r) => s + (+r.amount || 0), 0);

  document.getElementById("summaryRow").innerHTML = `
    <div class="sum-card"><div class="num">${rows.length}</div><div class="lbl">expected this month</div></div>
    <div class="sum-card"><div class="num" style="color:var(--green)">${paid.length}</div><div class="lbl">paid</div></div>
    <div class="sum-card"><div class="num" style="color:var(--blue)">${received.length}</div><div class="lbl">awaiting payment</div></div>
    <div class="sum-card ${overdueCount ? "overdue":""}"><div class="num">${overdueCount}</div><div class="lbl">needs attention</div></div>
    <div class="sum-card"><div class="num" style="font-size:18px">${fmtMoney(sumOpen) || "—"}</div><div class="lbl">open · ${fmtMoney(sumPaid)} paid</div></div>
  `;

  let html = "";
  const group = (title, list, cls) => {
    if (!list.length) return "";
    return `<div class="section">
      <div class="section-head"><h2>${title}</h2><span class="count">${list.length}</span></div>
      ${list.map(rowHtml).join("")}
    </div>`;
  };

  const late = expected.filter(r => r.alert === "late");
  const waiting = expected.filter(r => !r.alert);
  const ov = received.filter(r => r.alert === "overdue");
  const okRec = received.filter(r => !r.alert);

  html += group("⚠️ Not received yet (overdue arrival)", late, "late");
  html += group("🔴 Payment overdue", ov, "overdue");
  html += group("🔵 Awaiting payment", okRec, "");
  html += group("⚪ Expected — not received yet", waiting, "");
  html += group("✅ Paid", paid, "");

  if (!rows.length) {
    html = `<div class="empty">
      <div class="big">🗒️</div>
      <div style="font-weight:600;margin-bottom:6px">No providers active for ${esc(fmtMonth(viewKey))}</div>
      <div style="font-size:13px">Add your utility providers via “＋ Provider”.<br>Each month's checklist is then generated automatically.</div>
    </div>`;
  }

  document.getElementById("listArea").innerHTML = html;
}

function statusBadge(r) {
  if (r.status === "paid") return '<span class="badge b-paid">PAID</span>';
  if (r.status === "received") {
    if (r.alert === "overdue") return '<span class="badge b-overdue">OVERDUE</span>';
    return '<span class="badge b-received">RECEIVED</span>';
  }
  if (r.alert === "late") return '<span class="badge b-late">MISSING</span>';
  return '<span class="badge b-expected">EXPECTED</span>';
}

function rowHtml(r) {
  const p = r.provider;
  const {y, m} = keyParts(r.month);
  const bDay = effBillingDay(p, y, m);
  let sub = "";
  if (r.status === "paid") sub = `Received ${fmtDate(r.receivedDate)} · due ${fmtDate(r.dueDate)} · paid ${fmtDate(r.paidDate)}`;
  else if (r.status === "received") sub = `Received ${fmtDate(r.receivedDate)} · <b style="color:var(--red)">due ${fmtDate(r.dueDate)}</b>`;
  else sub = `Expected around ${new Date(y, m, bDay).toLocaleDateString(undefined,{day:"numeric", month:"short"})}${r.expectedDueDate ? " · due ~" + r.expectedDueDate.toLocaleDateString(undefined,{day:"numeric", month:"short"}) : ""}`;

  const expAmt = p.amount !== "" && p.amount != null ? ` <span class="diff">(exp. ${fmtMoney(p.amount)})</span>` : "";
  let diffHtml = "";
  if (r.status !== "expected" && r.amountDiff !== 0) {
    const up = r.amountDiff > 0;
    diffHtml = ` <span class="diff ${up?"up":"down"}">${up?"+":""}${fmtMoney(Math.abs(r.amountDiff)*Math.sign(r.amountDiff)).replace(/ /g,"")}${up?" above":" below"} expected</span>`;
  }

  return `<div class="inv-card" onclick="openInvoiceModal('${esc(r.month)}','${esc(p.id)}')">
    <div class="inv-icon" style="background:#f0edff;color:var(--primary)">${CAT_ICONS[p.category] || "📄"}</div>
    <div class="inv-main">
      <div class="inv-name">${esc(p.name)} <span class="cat-chip">${esc(p.category)}</span></div>
      <div class="inv-sub">${sub}</div>
    </div>
    <div class="inv-right">
      <div class="inv-amount">${r.amount !== "" ? fmtMoney(r.amount) : "—"}${expAmt}</div>
      ${diffHtml ? `<div>${diffHtml}</div>` : ""}
      <div style="margin-top:6px">${statusBadge(r)}</div>
    </div>
  </div>`;
}

/* ---------- Provider modal ---------- */
let editingProviderId = null;

function openProviderModal(id) {
  editingProviderId = id || null;
  const p = id ? state.providers.find(x => x.id === id) : null;
  document.getElementById("providerModalTitle").textContent = p ? "Edit provider" : "Add provider";
  document.getElementById("pName").value = p ? p.name : "";
  document.getElementById("pCategory").value = p ? p.category : "Electricity";
  document.getElementById("pAmount").value = p ? p.amount : "";
  document.getElementById("pBillingDay").value = p ? p.billingDay : 5;
  document.getElementById("pDueDays").value = p ? p.dueDays : 14;
  document.getElementById("pAccount").value = p ? (p.account||"") : "";
  document.getElementById("pNotes").value = p ? (p.notes||"") : "";
  document.getElementById("pActive").checked = p ? !!p.active : true;
  openModal("providerModalOverlay");
  setTimeout(() => document.getElementById("pName").focus(), 50);
}

function saveProvider() {
  const name = document.getElementById("pName").value.trim();
  if (!name) { toast("Please enter a name"); return; }
  const vals = {
    name,
    category: document.getElementById("pCategory").value,
    amount: document.getElementById("pAmount").value.trim(),
    billingDay: Math.max(1, Math.min(31, +document.getElementById("pBillingDay").value || 1)),
    dueDays: Math.max(0, Math.min(120, +document.getElementById("pDueDays").value || 0)),
    account: document.getElementById("pAccount").value.trim(),
    notes: document.getElementById("pNotes").value.trim(),
    active: document.getElementById("pActive").checked
  };
  if (editingProviderId) {
    const p = state.providers.find(x => x.id === editingProviderId);
    Object.assign(p, vals);
    toast("Provider updated");
  } else {
    state.providers.push({ id: uid(), created: viewKey, ...vals });
    toast("Provider added — appears in checklists from " + fmtMonth(viewKey));
  }
  state.sample = false;
  saveState();
  closeModal("providerModalOverlay");
  render();
}

/* ---------- Invoice modal ---------- */
let modalCtx = { month:null, pid:null };

function openInvoiceModal(mKey, pid) {
  modalCtx = { month: mKey, pid };
  const p = state.providers.find(x => x.id === pid);
  if (!p) return;
  const r = computeRow(mKey, p);
  const key = invKey(mKey, pid);
  const e = state.invoices[key];

  let body = `<h3>${CAT_ICONS[p.category]||"📄"} ${esc(p.name)} <span style="font-weight:400;font-size:14px;color:var(--text-muted)">· ${esc(fmtMonth(mKey))}</span></h3>`;

  body += `<div style="font-size:13px;color:var(--text-muted);margin:-8px 0 14px">
    Expected around day ${effBillingDay(p, keyParts(mKey).y, keyParts(mKey).m)} · typical due ${p.dueDays} days later
    ${p.amount!==""&&p.amount!=null? " · expected amount "+fmtMoney(p.amount):""}
    ${p.account? " · acct "+esc(p.account):""}
  </div>`;

  // Status buttons depending on current state
  body += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">`;
  if (r.status === "expected") body += `<button class="btn btn-primary" onclick="markReceived()">✔ Mark invoice received</button>`;
  if (r.status === "received") {
    body += `<button class="btn btn-primary" onclick="markPaid()">💸 Mark as paid</button>`;
    body += `<button class="btn btn-ghost" onclick="backToExpected()">↩ Not received after all</button>`;
  }
  if (r.status === "paid") body += `<button class="btn btn-ghost" onclick="backToReceived()">↩ Undo payment</button>`;
  body += `</div>`;

  // Detail fields
  const showDetail = r.status !== "expected";
  body += `<div class="${showDetail?"":"hidden-fields"}">
    <div class="row3">
      <div class="field"><label>Amount</label><input id="iAmount" type="number" step="0.01" min="0" value="${r.amount!==""?esc(r.amount):""}" placeholder="0.00"></div>
      <div class="field"><label>Due date</label><input id="iDue" type="date" value="${r.dueDate||""}"></div>
      <div class="field"><label>${r.status==="paid"?"Paid on":"Received on"}</label><input id="iPaid" type="date" value="${(r.status==="paid"?r.paidDate:r.receivedDate)||todayISO()}"></div>
    </div>
    <div class="field"><label>Note</label><input id="iNote" value="${esc(r.note)}" placeholder="optional — e.g. meter reading, dispute…"></div>
    ${showDetail?`<div class="modal-actions" style="justify-content:flex-start"><button class="btn btn-primary" onclick="saveInvoiceDetail(false)">Save details</button>${r.status==="paid"?'<button class="btn btn-primary" onclick="saveInvoiceDetail(true)">Save & stay paid</button>':""}</div>`:""}
  </div>`;

  if (!showDetail) {
    body += `<div class="hint" style="margin-top:6px">Nothing received yet for this month. Click above once the invoice arrives.</div>`;
  }

  body += `<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal('invoiceModalOverlay')">Close</button></div>`;

  document.getElementById("invoiceModalBody").innerHTML = body;
  openModal("invoiceModalOverlay");
}

function defaultDue(pid) {
  const p = state.providers.find(x => x.id === pid);
  const arrival = new Date();
  const d = new Date(arrival.getTime() + (p ? p.dueDays : 14) * 86400000);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function ensureEntry() {
  const key = invKey(modalCtx.month, modalCtx.pid);
  if (!state.invoices[key]) {
    state.invoices[key] = { status: "expected", providerId: modalCtx.pid };
  }
  return state.invoices[key];
}

function markReceived() {
  const e = ensureEntry();
  e.status = "received";
  e.receivedDate = e.receivedDate || todayISO();
  if (!e.dueDate) e.dueDate = defaultDue(modalCtx.pid);
  state.sample = false;
  saveState();
  openInvoiceModal(modalCtx.month, modalCtx.pid);
  render();
}

function markPaid() {
  const e = ensureEntry();
  e.status = "paid";
  e.paidDate = e.paidDate || todayISO();
  if (!e.receivedDate) e.receivedDate = todayISO();
  if (!e.dueDate) e.dueDate = defaultDue(modalCtx.pid);
  state.sample = false;
  saveState();
  openInvoiceModal(modalCtx.month, modalCtx.pid);
  render();
}

function backToExpected() {
  const key = invKey(modalCtx.month, modalCtx.pid);
  delete state.invoices[key];
  saveState();
  openInvoiceModal(modalCtx.month, modalCtx.pid);
  render();
}

function backToReceived() {
  const e = ensureEntry();
  e.status = "received";
  e.paidDate = null;
  saveState();
  openInvoiceModal(modalCtx.month, modalCtx.pid);
  render();
}

function saveInvoiceDetail(stayPaid) {
  const e = ensureEntry();
  const amt = document.getElementById("iAmount").value.trim();
  e.amount = amt === "" ? null : amt;
  e.dueDate = document.getElementById("iDue").value || null;
  e.note = document.getElementById("iNote").value.trim();
  const d = document.getElementById("iPaid").value;
  if (e.status === "paid") e.paidDate = d || todayISO();
  else e.receivedDate = d || todayISO();
  saveState();
  toast("Saved");
  if (!stayPaid) closeModal("invoiceModalOverlay");
  render();
}

/* ---------- Settings / providers overview ---------- */
function openProvidersModal() {
  const list = state.providers.slice().sort((a,b) => a.name.localeCompare(b.name));
  let html = "";
  if (!list.length) html = `<div class="hint">No providers yet.</div>`;
  list.forEach(p => {
    html += `<div class="prov-list-item ${p.active?"":"inactive"}">
      <div class="inv-icon" style="background:#f0edff;color:var(--primary);width:36px;height:36px;font-size:17px">${CAT_ICONS[p.category]||"📄"}</div>
      <div class="p-main">
        <div class="p-name">${esc(p.name)} <span class="cat-chip">${esc(p.category)}</span> ${p.active?"":'<span class="cat-chip">inactive</span>'}</div>
        <div class="p-sub">arrives ~day ${p.billingDay} · due +${p.dueDays}d ${p.amount!==""&&p.amount!=null? " · expected "+fmtMoney(p.amount) : " · variable amount"}</div>
      </div>
      <button class="btn btn-ghost" style="font-size:13px" onclick="openProviderModal('${p.id}')">Edit</button>
    </div>`;
  });
  document.getElementById("provList").innerHTML = html;
  document.getElementById("backupArea").value = JSON.stringify(state);
  openModal("settingsModalOverlay");
}

function loadBackup() {
  try {
    const parsed = JSON.parse(document.getElementById("backupArea").value);
    if (!parsed || !Array.isArray(parsed.providers)) throw new Error("bad");
    state = parsed;
    if (state.invoices == null) state.invoices = {};
    state.sample = !!state.sample;
    saveState();
    toast("Data restored");
    closeModal("settingsModalOverlay");
    render();
  } catch(e) { toast("Could not parse the JSON — please check it"); }
}

function resetAll() {
  if (!confirm("Delete ALL providers and invoice records? This cannot be undone.")) return;
  state = { sample:false, providers: [], invoices: {} };
  saveState();
  closeModal("settingsModalOverlay");
  render();
  toast("All data deleted");
}

function clearSampleData() {
  state.providers = [];
  state.invoices = {};
  state.sample = false;
  saveState();
  render();
  toast("Sample data removed — add your own providers!");
}

/* ---------- Misc UI ---------- */
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
document.querySelectorAll(".modal-overlay").forEach(o => o.addEventListener("click", ev => { if (ev.target === o) o.classList.remove("open"); }));
document.addEventListener("keydown", ev => { if (ev.key === "Escape") document.querySelectorAll(".modal-overlay").forEach(o => o.classList.remove("open")); });

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

document.getElementById("prevMonth").onclick = () => {
  const {y,m} = keyParts(viewKey);
  const ny = m === 0 ? y-1 : y, nm = m === 0 ? 11 : m-1;
  viewKey = monthKey(ny, nm); render();
};
document.getElementById("nextMonth").onclick = () => {
  const {y,m} = keyParts(viewKey);
  const ny = m === 11 ? y+1 : y, nm = m === 11 ? 0 : m+1;
  viewKey = monthKey(ny, nm); render();
};
document.getElementById("todayBtn").onclick = () => { viewKey = monthKey(CURRENT_YEAR, CURRENT_MONTH); render(); };

loadState();
render();
</script>
</body>
</html>
